name: Phase III Audit Matrix 100

on:
  pull_request:
    branches:
      - jsonwisdom
    paths:
      - "phase3/audit-matrix/**"
      - "phase3/calibration-100/**"
      - ".github/workflows/phase3-audit-matrix-100.yml"

permissions:
  contents: read

jobs:
  audit-history-100:
    runs-on: ubuntu-24.04
    env:
      CALIBRATION_HEAD: 5ea6039073ee5f1f5e8047a8f075da9d99a9d16a
    steps:
      - name: Checkout calibration branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind canonical calibration head
        run: |
          set -euo pipefail
          git cat-file -e "$CALIBRATION_HEAD^{commit}"
          test "$(git rev-parse origin/jsonwisdom)" = "$CALIBRATION_HEAD"
          echo "CALIBRATION_HEAD_BOUND=TRUE"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build corrected read-only audit tool
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -trimpath -ldflags='-s -w -buildid=' \
            -o bin/jqg50-history-audit \
            ./phase3/audit-matrix/main.go
          sha256sum bin/jqg50-history-audit | tee JQG-50_PHASE_III_100_RUNNER.sha256

      - name: Verify no network package imports
        run: |
          set -euo pipefail
          if grep -RInE '"(net|net/http|net/url|crypto/tls)"' phase3/audit-matrix; then
            echo "NETWORK_IMPORT_DETECTED"
            exit 1
          fi
          echo "NETWORK_IMPORTS=NONE"

      - name: Execute 100-commit calibration
        run: |
          set -euo pipefail
          ./bin/jqg50-history-audit \
            --repo . \
            --ref "$CALIBRATION_HEAD" \
            --max-count 100 \
            --output JQG-50_PHASE_III_AUDIT_MATRIX_100.csv \
            | tee JQG-50_PHASE_III_AUDIT_100_LOG.txt

          test -s JQG-50_PHASE_III_AUDIT_MATRIX_100.csv
          test "$(head -n 1 JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)" = 'commit,max_state,gap_class,exit_reason'
          ROWS="$(($(wc -l < JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)-1))"
          test "$ROWS" -eq 100
          test "$(awk -F, 'NR>1 && $2 != "L-2" {n++} END {print n+0}' JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)" -eq 0

          VOID="$(awk -F, 'NR>1 && $3 == "void" {n++} END {print n+0}' JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)"
          CONTRADICTORY="$(awk -F, 'NR>1 && $3 == "contradictory" {n++} END {print n+0}' JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)"
          PARTIAL="$(awk -F, 'NR>1 && $3 == "partial" {n++} END {print n+0}' JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)"
          CLEAN="$(awk -F, 'NR>1 && $3 == "clean" {n++} END {print n+0}' JQG-50_PHASE_III_AUDIT_MATRIX_100.csv)"
          test "$((VOID + CONTRADICTORY + PARTIAL + CLEAN))" -eq 100

          {
            echo "CALIBRATION_HEAD=$CALIBRATION_HEAD"
            echo "AUDITED_ROWS=100"
            echo "GAP_CLASS_VOID=$VOID"
            echo "GAP_CLASS_CONTRADICTORY=$CONTRADICTORY"
            echo "GAP_CLASS_PARTIAL=$PARTIAL"
            echo "GAP_CLASS_CLEAN=$CLEAN"
            echo "MAX_STATE_CEILING=L-2"
            echo "FINDINGS_ARE_OBSERVATIONS=TRUE"
            echo "AUTHORITY_AUTO_PROMOTION=FALSE"
            echo "ORIGINAL_50_COMMIT_ARTIFACTS_EDITED=FALSE"
          } | tee JQG-50_PHASE_III_100_DISTRIBUTION.txt

      - name: Upload additive 100-commit evidence
        uses: actions/upload-artifact@v4
        with:
          name: jqg50-phase-iii-audit-matrix-100
          path: |
            JQG-50_PHASE_III_AUDIT_MATRIX_100.csv
            JQG-50_PHASE_III_AUDIT_100_LOG.txt
            JQG-50_PHASE_III_100_DISTRIBUTION.txt
            JQG-50_PHASE_III_100_RUNNER.sha256
          if-no-files-found: error
          retention-days: 30
