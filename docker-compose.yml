version: "3.9"
services:
  agent-ingest-jay:
    build: ./agents/ingest-jay
    environment:
      - AUTHORITY_JAY_ENS=jaywisdom.base.eth
      - WHITELIST_FEEDS=congress.gov,pacer.uscourts.gov,c-span.org,supremecourt.gov
  agent-hash-jay:
    build: ./agents/hash-jay
  agent-scorer-jay:
    build: ./agents/scorer-jay
  agent-report-jay:
    build: ./agents/report-jay
  agent-publish-jay:
    build: ./agents/publish-jay
    volumes:
      - ipfs_data:/data/ipfs
  agent-verifier-jay:
    build: ./agents/verifier-jay
    volumes:
      - ./:/data
    environment:
      - WATCH_DOMAIN=data.jaywisdom.eth
      - WATCH_INTERVAL=60
    restart: unless-stopped
volumes:
  ipfs_data:
