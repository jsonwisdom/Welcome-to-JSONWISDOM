services:
  agent-producer-jay:
    build:
      context: .
      dockerfile: agents/producer-jay/Dockerfile
    volumes:
      - ./:/app
    restart: unless-stopped

  agent-verifier-jay:
    build:
      context: .
      dockerfile: agents/verifier-jay/Dockerfile
    volumes:
      - ./:/data
    environment:
      - WATCH_DOMAIN=data.jaywisdom.eth
      - WATCH_INTERVAL=60
      - WATCH_RPC_URL=https://mainnet.base.org
      - WATCH_REGISTRY=0x5dC881d0A0291F90d01142b0575Aa4000FE5f547
    restart: unless-stopped

  agent-publisher-jay:
    build:
      context: .
      dockerfile: agents/publisher-jay/Dockerfile
    volumes:
      - ./:/app
    environment:
      - PUBLISH_DOMAIN=data.jaywisdom.eth
      - PUBLISH_RPC_URL=https://mainnet.base.org
      - PUBLISH_REGISTRY=0x5dC881d0A0291F90d01142b0575Aa4000FE5f547
      - DRY_RUN=true
    restart: "no"
