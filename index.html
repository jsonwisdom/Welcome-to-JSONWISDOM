<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to Jason. The honest front door to JSONWisdom.">
  <meta property="og:title" content="Welcome to Jason">
  <meta property="og:description" content="A work in progress. No fake launch claims.">
  <meta property="og:type" content="website">
  <title>Welcome to Jason</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f4efe6;
      --ink: #11100e;
      --acid: #d8ff45;
      --red: #ff4f3d;
      --line: rgba(244, 239, 230, 0.24);
    }

    * { box-sizing: border-box; }

    html { background: var(--ink); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--ink);
      background-size: 48px 48px;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 56px);
    }

    .topline,
    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font: 700 0.75rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status {
      color: var(--acid);
    }

    .hero {
      align-self: center;
      max-width: 1180px;
      padding: clamp(64px, 12vh, 160px) 0;
    }

    h1 {
      margin: 0;
      max-width: 1100px;
      font-size: clamp(4.25rem, 15vw, 13rem);
      line-height: 0.78;
      letter-spacing: -0.085em;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      color: var(--acid);
    }

    .truth {
      max-width: 780px;
      margin: clamp(44px, 7vw, 84px) 0 0;
      font-size: clamp(1.35rem, 3vw, 2.5rem);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .truth strong {
      color: var(--red);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    a {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      padding: 0 22px;
      border: 2px solid var(--paper);
      color: var(--paper);
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:first-child {
      border-color: var(--acid);
      background: var(--acid);
      color: var(--ink);
    }

    a:hover,
    a:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0 var(--red);
      outline: none;
    }

    footer {
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: rgba(244, 239, 230, 0.68);
    }

    footer span:last-child {
      text-align: right;
    }

    @media (max-width: 640px) {
      h1 { font-size: clamp(4rem, 23vw, 7rem); }
      .topline, footer { flex-direction: column; }
      footer span:last-child { text-align: left; }
    }

    @media (prefers-reduced-motion: no-preference) {
      a { transition: transform 120ms ease, box-shadow 120ms ease; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <span>JSONWisdom / Atomic Reset</span>
      <span class="status">Work in progress</span>
    </header>

    <section class="hero" aria-labelledby="title">
      <h1 id="title">Welcome to <span>Jason.</span></h1>
      <p class="truth">
        Seven hundred pull requests. Too many repositories.
        <strong>Nothing here gets to pretend it works until it actually works.</strong>
      </p>
      <div class="actions">
        <a href="https://github.com/jsonwisdom">Enter the work</a>
        <a href="README.md">Read the map</a>
      </div>
    </section>

    <footer>
      <span>No launch claims. No fake green lights.</span>
      <span>Authority = false. Proof before promotion.</span>
    </footer>
  </main>
</body>
</html>
